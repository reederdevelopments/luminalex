        <!doctype html>
        <html>

        <head>
            <meta charset="utf-8">
            <meta name="x-apple-disable-message-reformatting">
            <meta name="color-scheme" content="light">
            <meta name="supported-color-schemes" content="light">
            <title>Email Preview</title>
            <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
            <style>
                /* Help in clients that keep <style> (Gmail, Apple Mail, iOS, Outlook.com) */
                @media screen {{.font-montserrat {{font-family: "Montserrat", Arial, sans-serif !important;}}}}
            </style>
        </head>

        <body style="margin:0;padding:0;background:#f5f6f7;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f5f6f7;">
                <tr>
                    <td align="center" style="padding:24px;">
                        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"
                            style="width:600px;max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;">

                            <!-- Actual banner image -->
                            <tr>
                                <td align="center" style="padding:0; border-bottom:1px solid #e5e7eb;">


                                    <div style="
            background-image:url('https://uploads.onecompiler.io/443jyqqru/443jxvpkt/Report%20Guide%20Header.png');
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            width:100%;
            max-width:600px;
            height:80px;
            margin:0 auto;
            text-align:center;">
                                        <div class="font-montserrat" style="height:80px; line-height:80px; font-family:'Montserrat', Arial, sans-serif;
                        font-weight:800; font-size:24px; letter-spacing:0.5px; color:#ffffff;">
                                            Unifi
                                        </div>
                                    </div>


                                </td>
                            </tr>

                            <tr>
                                <td width="600" bgcolor="#e4e3e4"
                                    style="padding:0; border-bottom:1px solid #e5e7eb; background-color:#e4e3e4;">
                                    <!-- Vertically centered title inside a fixed-height bar -->
                                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                        <tr>
                                            <td align="center" valign="middle" height="60"
                                                style="height:60px; border-bottom:1px solid #e5e7eb;" class="font-montserrat">
                                                <div
                                                    style="font-family:'Montserrat', Arial, sans-serif; font-weight:700; font-size:20px; color:#111827;">
                                                    Maoni Survey
                                                </div>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>

                            <!-- Intro + Button -->
                            <tr>
                                <td style="padding:8px 24px 24px;">
                                    <p style="font-family:'Montserrat', Arial, sans-serif;
                    font-size:16px;line-height:1.55;color:#374151;margin:0 0 16px;">
                                        <br>
                                        Hi {NAME}. <br><br>
                                        {EMAIL_BODY} 
										<br><br>
                                        Click button below!
                                        <br>
                                    </p>
                                    <!-- no bottom margin here -->
                                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                                        style="margin:12px 0 0;">
                                        <tr>
                                            <td align="center" style="text-align:center;">
                                                <a href= "https://maoni.unifi.credit/" style="background:#60c3ad;border:1px solid #60c3ad;border-radius:10px;color:#ffffff;
                            display:inline-block;font-family:'Montserrat', Arial, sans-serif;
                            font-weight:600;line-height:44px;padding:0 18px;text-decoration:none;">
                                                    View Maoni
                                                </a>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>



                            <!-- Contact -->
                            <tr>
  <td align="center" style="padding:0; line-height:0; font-size:0;">
    <img
      src="https://uploads.onecompiler.io/443jyqqru/443jxvpkt/Footer.png"
      alt="Unifi HR footer"
      width="600"
      style="display:block; width:100%; max-width:600px; height:auto; border:0; outline:none; text-decoration:none;">
  </td>
</tr>

                        </table>

                        <!-- tiny footer -->
                        <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
                            font-size:12px;color:#6b7280;margin-top:12px;">
                            Automated Email · maoni@unifi.credit · {DATE}
                        </div>
                    </td>
                </tr>
            </table>
        </body>
        </html>
